[package]
name = "rpf9_explorer"
version = "1.8.2"
edition = "2021"

[[bin]]
name = "Percy6Stars"
path = "src/main.rs"

[dependencies]
eframe = "0.31"
flate2 = "1.0"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }
rusty-opus = "1.2"
wgpu = "24"
winit = "0.30"
glam = "0.29"
bytemuck = { version = "1.21", features = ["derive"] }
texture2ddecoder = "0.1.2"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows = { version = "0.58", features = ["Win32_Media_Audio", "Win32_System_Com"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"

[dev-dependencies]
egui_kittest = { version = "0.31.1", features = ["wgpu", "eframe"] }
