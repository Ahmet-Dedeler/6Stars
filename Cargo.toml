[package]
name = "rpf9_explorer"
version = "1.13.0"
edition = "2021"
rust-version = "1.89"

[[bin]]
name = "Percy6Stars"
path = "src/main.rs"

[dependencies]
eframe = "0.31"
egui-wgpu = "0.31"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }
rusty-opus = "1.2"
wgpu = "24"
winit = "0.30"
glam = "0.29"
bytemuck = { version = "1.21", features = ["derive"] }
texture2ddecoder = "0.1.2"
tempfile = "3"
# BCPack BC1 decoder (MIT OR Apache-2.0), pinned to a reviewed commit.
bcpack-rs = { git = "https://github.com/Ahmet-Dedeler/bcpack-rs", rev = "c51ec521cbe6869136f29f5d157342374ef5cf33", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# Clean-room Bink 2 video and Bink Audio decoder (Apache-2.0) by codingkoala, pinned to a reviewed
# commit. This is our fork with one fix on top of 277c470: the row edge flag count (720p and 4K
# clips failed to decode). Go back to codingkoala/bink2-decoder once
# https://github.com/codingkoala/bink2-decoder/pull/3 is merged.
bink2_decoder = { package = "bink2", git = "https://github.com/Ahmet-Dedeler/bink2-decoder", rev = "e365f099acea6304ab32dabf221e720bfcc6ee65" }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows = { version = "0.58", features = ["Win32_Media_Audio", "Win32_System_Com"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"

[dev-dependencies]
egui_kittest = { version = "0.31.1", features = ["wgpu", "eframe"] }
