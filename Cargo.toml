[package]
name = "rpf9_explorer"
version = "1.11.0"
edition = "2021"

[[bin]]
name = "Percy6Stars"
path = "src/main.rs"

[dependencies]
eframe = "0.31"
egui-wgpu = "0.31"
flate2 = "1.0"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }
rusty-opus = "1.2"
wgpu = "24"
winit = "0.30"
glam = "0.29"
bytemuck = { version = "1.21", features = ["derive"] }
texture2ddecoder = "0.1.2"
tempfile = "3"
# BCPack BC1 decoder (MIT OR Apache-2.0), pinned to a reviewed commit.
bcpack-rs = { git = "https://github.com/Ahmet-Dedeler/bcpack-rs", rev = "0a887de1edc9c22a425605091f1a8365fdf74dbb", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# Clean-room Bink 2 video decoder (Apache-2.0), pinned to a reviewed commit.
bink2_decoder = { package = "bink2", git = "https://github.com/codingkoala/bink2-decoder", rev = "9ec94bfd4682acee7c579084c6de532bba8c9bf7" }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows = { version = "0.58", features = ["Win32_Media_Audio", "Win32_System_Com"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"

[dev-dependencies]
egui_kittest = { version = "0.31.1", features = ["wgpu", "eframe"] }
