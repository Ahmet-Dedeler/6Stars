[package]
name = "rpf9_explorer"
version = "1.4.1"
edition = "2021"

[[bin]]
name = "6Stars"
path = "src/main.rs"

[dependencies]
eframe = "0.31"
flate2 = "1.0"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }
rusty-opus = "1.2"
texture2ddecoder = "0.1.2"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows = { version = "0.58", features = ["Win32_Media_Audio", "Win32_System_Com"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
